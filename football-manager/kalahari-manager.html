<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1310">
<meta name="description" content="Kalahari Manager — a pocket-sized football management game. Pick the side, set the tactics, live the ninety minutes.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kalahari Manager</title>
<!-- Single-file offline build. Open it in any browser; progress is saved in the browser. -->
<style>
/* Kalahari Manager — phone-first, dark, no external assets. */

:root {
  --bg: #0d1310;
  --bg-raised: #151e19;
  --panel: #18221c;
  --panel-2: #1e2a23;
  --line: #26342c;
  --line-soft: #202c25;
  --text: #e8efe9;
  --text-dim: #94a89b;
  --text-faint: #6c8073;
  --gold: #f2c14e;
  --gold-dim: #b08c2c;
  --pitch: #2f9e6b;
  --pitch-dark: #1c5f41;
  --danger: #e2685f;
  --warn: #e0a03c;
  --good: #4fc98a;
  --radius: 14px;
  --radius-sm: 9px;
  --tap: 44px;
  --nav-h: 60px;
  --pad: 14px;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior-y: none;
}

body { -webkit-font-smoothing: antialiased; }

button, input, select { font: inherit; color: inherit; }

.app {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
}

/* Top bar ------------------------------------------------------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 10px;
  background: linear-gradient(180deg, #101913 0%, #0f1712 100%);
  border-bottom: 1px solid var(--line);
}

.topbar-row { display: flex; align-items: center; gap: 10px; }
.topbar-club { min-width: 0; flex: 1; }
.topbar-name { font-weight: 700; font-size: 1.02rem; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-sub { font-size: .76rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-cash { text-align: right; font-variant-numeric: tabular-nums; }
.topbar-cash strong { display: block; font-size: .95rem; color: var(--gold); }
.topbar-cash span { font-size: .7rem; color: var(--text-faint); }

/* Crest ---------------------------------------------------------------- */

.crest { width: 34px; height: 38px; flex: none; }
.crest.sm { width: 20px; height: 23px; }
.crest.lg { width: 54px; height: 61px; }

/* View ----------------------------------------------------------------- */

.view {
  flex: 1;
  padding: var(--pad) var(--pad) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  outline: none;
}

.section-title {
  font-size: .74rem;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--text-faint);
  margin: 20px 2px 8px;
  font-weight: 700;
}
.section-title:first-child { margin-top: 4px; }

.card {
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.card.tight { padding: 0; overflow: hidden; }
.card.flat { background: var(--bg-raised); }

/* Buttons -------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  font-weight: 600;
  font-size: .93rem;
  cursor: pointer;
  transition: transform .08s ease, opacity .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #14180f; }
.btn.wide { width: 100%; }
.btn.big { min-height: 54px; font-size: 1.05rem; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: #4a2b28; }
.btn-row { display: flex; gap: 8px; }
.btn-row > * { flex: 1; }

/* Segmented controls ---------------------------------------------------- */

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-height: 38px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-raised);
  color: var(--text-dim);
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #14180f; }
.chip.sm { min-height: 32px; font-size: .78rem; padding: 4px 10px; }

/* Fixture / result ------------------------------------------------------ */

.fixture {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}
.fixture .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fixture .side.away { flex-direction: row-reverse; text-align: right; }
.fixture .side span { font-size: .92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fixture .score {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  font-size: 1.15rem;
  padding: 2px 10px;
  border-radius: 8px;
  background: var(--bg-raised);
  min-width: 62px;
  text-align: center;
}
.fixture .score.small { font-size: .82rem; font-weight: 700; padding: 3px 8px; min-width: 52px; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: .9rem; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--text-dim); }
.kv strong { font-variant-numeric: tabular-nums; font-weight: 700; }

.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  background: var(--panel-2);
  color: var(--text-dim);
}
.pill.gold { background: rgba(242,193,78,.16); color: var(--gold); }
.pill.good { background: rgba(79,201,138,.15); color: var(--good); }
.pill.bad { background: rgba(226,104,95,.15); color: var(--danger); }
.pill.warn { background: rgba(224,160,60,.15); color: var(--warn); }

.form-run { display: inline-flex; gap: 3px; }
.form-run i {
  font-style: normal;
  width: 17px; height: 17px;
  border-radius: 5px;
  font-size: .62rem;
  font-weight: 800;
  display: grid;
  place-items: center;
  background: var(--panel-2);
  color: var(--text-dim);
}
.form-run i.W { background: rgba(79,201,138,.22); color: var(--good); }
.form-run i.D { background: rgba(148,168,155,.18); color: var(--text-dim); }
.form-run i.L { background: rgba(226,104,95,.2); color: var(--danger); }

/* Meters ---------------------------------------------------------------- */

.meter { height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--pitch); border-radius: 4px; }
.meter.gold > i { background: var(--gold); }
.meter.thin { height: 4px; }

/* Tables ---------------------------------------------------------------- */

table.grid { width: 100%; border-collapse: collapse; font-size: .86rem; }
table.grid th {
  text-align: right;
  font-size: .66rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--text-faint);
  font-weight: 700;
  padding: 8px 4px;
  border-bottom: 1px solid var(--line);
}
table.grid th:nth-child(2) { text-align: left; }
table.grid td { padding: 9px 4px; border-bottom: 1px solid var(--line-soft); text-align: right; font-variant-numeric: tabular-nums; }
table.grid td:nth-child(2) { text-align: left; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tr.me td { background: rgba(242,193,78,.08); }
table.grid tr.me td:nth-child(2) { font-weight: 700; color: var(--gold); }
table.grid tr.up td:first-child { color: var(--good); }
table.grid tr.down td:first-child { color: var(--danger); }
.team-cell { display: flex; align-items: center; gap: 7px; }
.team-cell span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 128px; }

/* Player rows ----------------------------------------------------------- */

.plist { display: flex; flex-direction: column; }
.prow {
  display: grid;
  grid-template-columns: 30px 1fr auto auto;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: none;
  border-left: 0; border-right: 0; border-top: 0;
  width: 100%;
  text-align: left;
  cursor: pointer;
}
.prow:last-child { border-bottom: 0; }
.prow:active { background: var(--panel-2); }
.prow .pos {
  font-size: .64rem; font-weight: 800; letter-spacing: .03em;
  padding: 3px 0; border-radius: 5px; text-align: center;
  background: var(--panel-2); color: var(--text-dim);
}
.prow .pos.GK { color: #e0a03c; }
.prow .pos.DF { color: #6fa8e0; }
.prow .pos.MF { color: #4fc98a; }
.prow .pos.FW { color: #e2685f; }
.prow .who { min-width: 0; }
.prow .who b { display: block; font-size: .93rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .who small { color: var(--text-faint); font-size: .72rem; display: flex; gap: 6px; align-items: center; }
.prow .cond { width: 42px; }
.prow .rating {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  font-size: .95rem;
  min-width: 30px;
  text-align: right;
}

/* Pitch ----------------------------------------------------------------- */

.pitch {
  position: relative;
  border-radius: var(--radius);
  background:
    repeating-linear-gradient(180deg, #1f6b4b 0 9%, #1b6044 9% 18%),
    #1b6044;
  border: 1px solid #235c44;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  margin-bottom: 10px;
}
.pitch::before, .pitch::after {
  content: "";
  position: absolute;
  left: 22%;
  width: 56%;
  height: 13%;
  border: 2px solid rgba(255,255,255,.18);
}
.pitch::before { top: -1px; border-top: 0; }
.pitch::after { bottom: -1px; border-bottom: 0; }
.pitch .halfway {
  position: absolute; left: 0; right: 0; top: 50%;
  border-top: 2px solid rgba(255,255,255,.16);
}
.pitch .circle {
  position: absolute; left: 50%; top: 50%;
  width: 26%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,.16); border-radius: 50%;
}

.slot {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 62px;
  text-align: center;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  color: var(--text);
}
.slot .shirt {
  width: 34px; height: 34px;
  margin: 0 auto 3px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: .74rem;
  font-weight: 800;
  color: #10160f;
  background: var(--gold);
  border: 2px solid rgba(0,0,0,.25);
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
  font-variant-numeric: tabular-nums;
}
.slot .nm {
  display: block;
  font-size: .63rem;
  font-weight: 700;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slot .lbl { display: block; font-size: .55rem; color: rgba(255,255,255,.65); letter-spacing: .05em; }
.slot[data-selected="true"] .shirt { outline: 3px solid #fff; }
.slot.unavailable .shirt { background: var(--danger); color: #fff; }
.slot.tired .shirt { background: var(--warn); }

.benchstrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.benchstrip::-webkit-scrollbar { display: none; }
.benchchip {
  flex: none;
  min-width: 84px;
  padding: 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-raised);
  text-align: center;
  cursor: pointer;
}
.benchchip b { display: block; font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.benchchip small { color: var(--text-faint); font-size: .68rem; }
.benchchip[data-selected="true"] { border-color: var(--gold); background: rgba(242,193,78,.12); }

/* News ------------------------------------------------------------------ */

.news-item { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.news-item:last-child { border-bottom: 0; }
.news-item b { display: block; font-size: .9rem; }
.news-item p { margin: 4px 0 0; font-size: .82rem; color: var(--text-dim); }
.news-item small { color: var(--text-faint); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; }
.news-item.unread { background: rgba(242,193,78,.05); }
.news-item.unread b::before { content: "•"; color: var(--gold); margin-right: 6px; }

/* Bottom nav ------------------------------------------------------------ */

.tabs {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 560px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: rgba(13,19,16,.94);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 30;
}
.tab {
  border: 0;
  background: none;
  color: var(--text-faint);
  height: var(--nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: .64rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
}
.tab svg { width: 21px; height: 21px; fill: currentColor; }
.tab[aria-current="page"] { color: var(--gold); }
.tab .badge {
  position: absolute;
  top: 8px; right: 50%;
  margin-right: -22px;
  min-width: 16px; height: 16px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: .6rem;
  display: grid; place-items: center;
  padding: 0 4px;
}

/* Sheets / modals -------------------------------------------------------- */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(4,8,6,.72);
  z-index: 70;
  backdrop-filter: blur(2px);
}
.sheet {
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: 560px;
  max-height: 86vh;
  overflow-y: auto;
  background: var(--bg-raised);
  border-radius: 18px 18px 0 0;
  border: 1px solid var(--line);
  border-bottom: 0;
  padding: 8px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 18px);
  animation: rise .18s ease-out;
}
@keyframes rise { from { transform: translate(-50%, 14px); opacity: .4; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-close {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 34px; height: 34px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text-dim);
  font-size: 1.25rem;
  line-height: 1;
  cursor: pointer;
  z-index: 2;
}
.sheet { position: fixed; }
.sheet .grab { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 12px; }
.sheet h2 { margin: 0 0 2px; font-size: 1.15rem; }
.sheet .sub { color: var(--text-dim); font-size: .84rem; margin: 0 0 14px; }

.attr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px; margin: 6px 0 14px; }
.attr { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; font-size: .82rem; }
.attr span { color: var(--text-dim); }
.attr b { font-variant-numeric: tabular-nums; }
.attr .meter { grid-column: 1 / -1; }

/* Match view ------------------------------------------------------------- */

.match {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
}
.match-head {
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--pad) 12px;
  background: linear-gradient(180deg, #16211a, #101913);
  border-bottom: 1px solid var(--line);
}
.scoreline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.scoreline .club { text-align: center; }
.scoreline .club b { display: block; font-size: .72rem; margin-top: 4px; line-height: 1.25; }
.scoreline .goals {
  font-size: 2.4rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
  text-align: center;
  line-height: 1.05;
}
.scoreline .clock { font-size: .78rem; color: var(--gold); font-weight: 700; text-align: center; }
.matchstats { display: flex; gap: 10px; margin-top: 12px; font-size: .7rem; color: var(--text-dim); }
.matchstats > div { flex: 1; }
.matchstats .bar { height: 4px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-top: 3px; display: flex; }
.matchstats .bar i { display: block; height: 100%; }
.matchstats .bar i:first-child { background: var(--gold); }
.matchstats .bar i:last-child { background: var(--text-faint); }

.feed { flex: 1; overflow-y: auto; padding: 10px var(--pad) 14px; -webkit-overflow-scrolling: touch; }
.ev { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 7px 0; font-size: .87rem; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ev .min { color: var(--text-faint); font-size: .74rem; font-variant-numeric: tabular-nums; padding-top: 2px; }
.ev.goal { font-weight: 700; color: var(--gold); }
.ev.red { color: var(--danger); font-weight: 600; }
.ev.yellow { color: var(--warn); }
.ev.injury { color: var(--danger); }
.ev.sub { color: var(--text-dim); }
.ev.note, .ev.chance { color: var(--text-dim); }
.ev.halftime, .ev.fulltime, .ev.kickoff { color: var(--text); font-weight: 700; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 10px 0; margin: 6px 0; }

.match-controls {
  display: flex;
  gap: 8px;
  padding: 10px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-top: 1px solid var(--line);
  background: var(--bg-raised);
}
.match-controls .btn { flex: 1; padding: 0 8px; font-size: .85rem; }

/* Start screen ------------------------------------------------------------ */

.start { padding: calc(env(safe-area-inset-top, 0px) + 26px) var(--pad) 40px; max-width: 560px; margin: 0 auto; }
.start h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -.02em; }
.start h1 span { color: var(--gold); }
.start .lede { color: var(--text-dim); margin: 0 0 22px; font-size: .95rem; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); margin-bottom: 6px; font-weight: 700; }
.field input {
  width: 100%;
  min-height: var(--tap);
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-raised);
}
.clubpick { display: grid; gap: 8px; }
.clubopt {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-raised);
  cursor: pointer;
  text-align: left;
  width: 100%;
}
.clubopt[aria-pressed="true"] { border-color: var(--gold); background: rgba(242,193,78,.1); }
.clubopt .info { flex: 1; min-width: 0; }
.clubopt .info b { display: block; font-size: .93rem; }
.clubopt .info small { color: var(--text-faint); font-size: .74rem; }

/* Toast -------------------------------------------------------------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px);
  transform: translateX(-50%);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 600;
  z-index: 90;
  max-width: 88vw;
  text-align: center;
  animation: fade .18s ease-out;
}

.empty { text-align: center; color: var(--text-faint); padding: 26px 10px; font-size: .88rem; }
.muted { color: var(--text-dim); }
.tiny { font-size: .74rem; }
.right { text-align: right; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.rowwrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
hr.sep { border: 0; border-top: 1px solid var(--line-soft); margin: 12px 0; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

  function nextMatchCard(app2, fixture) {

      <div class="fixture">

        <div class="side away">${crest(isHome ? opponent : club, "sm")}<span>${esc((isHome ? opponent : club).name)}</span></div>

      <div class="spread tiny muted" style="margin:8px 0 12px">

        <button class="btn ghost" data-action="tab:squad">Team selection</button>
      </div>
    </div>`;

  function squadScreen(app2) {

    <div class="seg" style="margin-bottom:12px">

  function pitchView(app2, club) {
    const slots = slotsOf(club.tactics.formation);

      const player = club.squad.find((p) => p.id === club.lineup[i]);

        <span class="shirt">+</span><span class="nm">Empty</span><span class="lbl">${slot.label}</span></button>`;
      }
      const unavailable = !isAvailable(player);
      const tired = player.condition < 70;
      const isSelected = selected?.kind === "slot" && selected.index === i;
      return `<button class="slot ${unavailable ? "unavailable" : tired ? "tired" : ""}"

      <span class="shirt">${ability(player)}</span>
      <span class="nm">${esc(player.last)}</span>
      <span class="lbl">${slot.label}${unavailable ? " \u26A0" : ""}</span>

    }).join("");
    const bench = club.bench.map((id) => club.squad.find((p) => p.id === id)).filter(Boolean);

            <span class="info">
              <b>${esc(c.name)}</b>
              <small>${esc(c.stadium)} \xB7 ${c.capacity.toLocaleString()} seats \xB7 ${difficulty(c.rep)}</small>
            </span>
            <span class="pill ${c.rep >= 74 ? "gold" : ""}">${c.rep}</span>
          </button>`).join("")}
      </div>

      <button class="btn primary wide big" style="margin-top:18px" data-start disabled>Pick a club to begin</button>
      <p class="tiny muted" style="margin-top:12px">Everything is saved on this device. Nothing is uploaded anywhere.</p>
    </div>`;
    document.body.appendChild(wrap);
    let chosen = null;
    wrap.addEventListener("click", (e) => {
      const opt = e.target.closest("[data-club]");
      const start = e.target.closest("[data-start]");
      if (opt) {
        chosen = opt.dataset.club;
        wrap.querySelectorAll("[data-club]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.club === chosen)));
        const btn = wrap.querySelector("[data-start]");
        btn.disabled = false;
        btn.textContent = `Take charge of ${CLUBS.find((c) => c.id === chosen).name}`;
        return;
      }
      if (start && chosen) {
        const name = wrap.querySelector("#mgr").value;
        app.state = newGame({ clubId: chosen, managerName: name, seed: Date.now() % 2147483647 });
        save(app.state);
        wrap.remove();
        app.route = "home";
        render();
      }
    });
  }
  function difficulty(rep) {
    if (rep >= 80) return "Expected to win it all";
    if (rep >= 66) return "Chasing the title";
    if (rep >= 52) return "Solid mid-table";
    return "Scrapping to stay up";
  }
  function render() {
    const appEl = $("#app");
    appEl.hidden = false;
    if (app.state.gameOver) {
      $("#topbar").innerHTML = "";
      $("#tabs").innerHTML = "";
      setHTML($("#view"), gameOverScreen(app));
      return;
    }
    ensureSelection(userTeam(app.state));
    setHTML($("#topbar"), renderTopbar(app));
    setHTML($("#view"), renderScreen(app));
    setHTML($("#tabs"), TABS.map((t) => `
    <button class="tab" data-action="tab:${t.id}" ${app.route === t.id ? 'aria-current="page"' : ""}>
      <svg viewBox="0 0 24 24"><path d="${t.icon}" fill-rule="evenodd"/></svg>
      ${t.label}
      ${t.id === "home" && unread() ? `<span class="badge">${unread()}</span>` : ""}
    </button>`).join(""));
  }
  var unread = () => app.state.news.filter((n) => !n.read).length;
  function onClick(event) {
    const el = event.target.closest("[data-action]");
    if (!el || el.disabled) return;
    const [action, arg] = el.dataset.action.split(":");
    const club = app.state ? userTeam(app.state) : null;
    switch (action) {
      case "tab":
        app.go(arg);
        return;
      case "play-match":
        closeSheet();
        playMatch(app);
        return;
      case "quick-match": {
        const result = quickPlayRound(app.state);
        app.save();
        app.go("home");
        if (result) toast(`${result.outcome === "W" ? "Won" : result.outcome === "D" ? "Drew" : "Lost"} ${result.own}-${result.opp} ${result.isHome ? "at home to" : "away to"} ${result.opponentName}`);
        return;
      }
      case "news": {
        const item = app.state.news.find((n) => n.id === Number(arg));
        if (!item) return;
        item.read = true;
        app.save();
        openSheet(newsSheet(app, item));
        render();
        return;
      }
      case "all-news":
        app.state.news.forEach((n) => {
          n.read = true;
        });
        app.save();
        openSheet(allNewsSheet(app));
        render();
        return;
      case "squad-view":
        app.squadView = arg;
        app.selection = null;
        render();
        return;
      case "auto-pick":
        autoSelect(club);
        app.selection = null;
        app.save();
        render();
        toast("Strongest available eleven picked.");
        return;
      case "slot": {
        const index = Number(arg);
        const sel = app.selection;
        if (sel?.kind === "slot" && sel.index === index) {
          const id = club.lineup[index];
          app.selection = null;
          render();
          if (id) openSheet(playerSheet(app, id));
          return;
        }
        if (sel?.kind === "slot") {
          const j = sel.index;
          [club.lineup[index], club.lineup[j]] = [club.lineup[j], club.lineup[index]];
          app.selection = null;
        } else if (sel?.kind === "bench") {
          const benchIndex = club.bench.indexOf(sel.id);
          const outId = club.lineup[index];
          club.lineup[index] = sel.id;
          if (benchIndex >= 0) club.bench[benchIndex] = outId;
          app.selection = null;
        } else {
          app.selection = { kind: "slot", index };
        }
        app.save();
        render();
        return;
      }
      case "benchpick": {
        const id = Number(arg);
        const sel = app.selection;
        if (sel?.kind === "bench" && sel.id === id) {
          app.selection = null;
          render();
          openSheet(playerSheet(app, id));
          return;
        }
        if (sel?.kind === "slot") {
          const benchIndex = club.bench.indexOf(id);
          const outId = club.lineup[sel.index];
          club.lineup[sel.index] = id;
          if (benchIndex >= 0) club.bench[benchIndex] = outId;
          app.selection = null;
        } else if (sel?.kind === "bench") {
          const a = club.bench.indexOf(sel.id);
          const b = club.bench.indexOf(id);
          [club.bench[a], club.bench[b]] = [club.bench[b], club.bench[a]];
          app.selection = null;
        } else {
          app.selection = { kind: "bench", id };
        }
        app.save();
        render();
        return;
      }
      case "player":
        openSheet(playerSheet(app, Number(arg)));
        return;
      case "select-xi": {
        const id = Number(arg);
        closeSheet();
        if (club.lineup.includes(id)) demote(club, id);
        else promote(club, id);
        app.save();
        render();
        return;
      }
      case "toggle-bench": {
        const id = Number(arg);
        closeSheet();
        if (club.lineup.includes(id)) {
          toast("He is in the starting eleven.");
          return;
        }
        if (club.bench.includes(id)) {
          club.bench = club.bench.filter((b) => b !== id);
          toast("Removed from the bench.");
        } else if (club.bench.length >= 7) {
          toast("The bench is full \u2014 drop someone first.");
        } else {
          club.bench.push(id);
          toast("Named as a substitute.");
        }
        app.save();
        render();
        return;
      }
      case "formation":
        setFormation(club, arg);
        app.save();
        render();
        return;
      case "mentality":
      case "pressing":
      case "tempo":
        club.tactics[action] = arg;
        app.save();
        render();
        return;
      case "toggle-autosubs":
        app.state.settings.autoSubs = !app.state.settings.autoSubs;
        app.save();
        render();
        return;
      case "league-tab":
        app.leagueTab = arg;
        app.fixtureRound = null;
        render();
        return;
      case "round":
        app.fixtureRound = Number(arg);
        render();
        return;
      case "club-info":
        openSheet(clubInfoSheet(app, arg));
        return;
      case "train-focus":
        setTraining(app.state, { focus: arg });
        app.save();
        render();
        return;
      case "train-intensity":
        setTraining(app.state, { intensity: arg });
        app.save();
        render();
        return;
      case "market":
        openSheet(marketSheet(app));
        return;
      case "sign": {
        const outcome = signPlayer(app.state, Number(arg));
        toast(outcome.message);
        app.save();
        if (outcome.ok) {
          closeSheet();
          render();
          openSheet(marketSheet(app));
        }
        return;
      }
      case "sell":
        closeSheet();
        openSheet(sellSheet(app, Number(arg)));
        return;
      case "confirm-sell": {
        const id = Number(arg);
        const offer = saleOffer(app.state, id);
        const outcome = sellPlayer(app.state, id, offer);
        toast(outcome.message);
        closeSheet();
        app.save();
        render();
        return;
      }
      case "renew": {
        const outcome = renewContract(app.state, Number(arg));
        toast(outcome.message);
        app.save();
        closeSheet();
        render();
        return;
      }
      case "new-game":
        openSheet(`
        <h2>Start a new career?</h2>
        <p class="sub">This deletes your current save. There is no way back.</p>
        <button class="btn danger wide" data-action="new-game-now">Delete and start again</button>
        <button class="btn wide ghost" style="margin-top:8px" data-action="close-sheet">Keep playing</button>`);
        return;
      case "new-game-now":
        closeSheet();
        clear();
        app.state = null;
        $("#app").hidden = true;
        startScreen();
        return;
      case "close-sheet":
        closeSheet();
        return;
    }
  }
  function promote(club, id) {
    const player = club.squad.find((p) => p.id === id);
    if (!player) return;
    const xi = club.lineup.map((pid) => club.squad.find((p) => p.id === pid));
    let index = -1;
    let worst = Infinity;
    xi.forEach((p, i) => {
      if (!p) {
        index = i;
        worst = -Infinity;
        return;
      }
      const samePos = p.pos === player.pos;
      const value = ability(p) + (samePos ? 0 : 40) + (isAvailable(p) ? 0 : -60);
      if (value < worst) {
        worst = value;
        index = i;
      }
    });
    if (index < 0) return;
    const outId = club.lineup[index];
    club.lineup[index] = id;
    club.bench = club.bench.filter((b) => b !== id);
    if (outId && !club.bench.includes(outId) && club.bench.length < 7) club.bench.push(outId);
    toast(`${shortName(player)} starts.`);
  }
  function demote(club, id) {
    const index = club.lineup.indexOf(id);
    if (index < 0) return;
    const player = club.squad.find((p) => p.id === id);
    const replacement = club.bench.map((bid) => club.squad.find((p) => p.id === bid)).filter((p) => p && isAvailable(p)).sort((a, b) => (b.pos === player.pos ? 1 : 0) - (a.pos === player.pos ? 1 : 0) || ability(b) - ability(a))[0];
    if (!replacement) {
      toast("Nobody on the bench to replace him.");
      return;
    }
    club.lineup[index] = replacement.id;
    club.bench = club.bench.map((b) => b === replacement.id ? id : b);
    toast(`${shortName(player)} drops to the bench.`);
  }
  boot();
})();

</script>
