name: Kalahari Manager APK

# Builds the WebView wrapper around football-manager/ and uploads the APK as a
# run artifact. GitHub's Ubuntu runners already carry the Android SDK.
on:
  push:
    paths:
      - 'football-manager/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: football-manager/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check what is inside the APK
        working-directory: football-manager/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E '^(package|application-label|sdkVersion|targetSdkVersion|uses-permission)' || true
          # The game has to actually be in there, along with a compiled activity.
          for entry in AndroidManifest.xml classes.dex assets/index.html assets/styles.css \
                       assets/js/main.js assets/js/engine.js assets/js/state.js assets/sw.js \
                       assets/manifest.webmanifest res/mipmap-xxxhdpi/ic_launcher.png; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "missing from APK: $entry"; exit 1; }
          done
          echo "assets in APK: $(unzip -Z1 "$APK" | grep -c '^assets/')"
          echo "apk size: $(du -h "$APK" | cut -f1)"

      - name: Name the APK
        working-directory: football-manager/android
        run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/kalahari-manager.apk
          ls -la ../../out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalahari-manager-apk
          path: out/kalahari-manager.apk
          if-no-files-found: error
