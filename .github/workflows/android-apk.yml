name: Kalahari Manager APK

# Builds the WebView wrapper around football-manager/ and uploads the APK as a
# run artifact. GitHub's Ubuntu runners already carry the Android SDK.
on:
  push:
    paths:
      - 'football-manager/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: football-manager/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check what is inside the APK
        working-directory: football-manager/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E '^(package|application-label|sdkVersion|targetSdkVersion|uses-permission)' || true
          # The game has to actually be in there, along with a compiled activity.
          for entry in AndroidManifest.xml classes.dex assets/index.html assets/styles.css \
                       assets/js/main.js assets/js/engine.js assets/js/state.js assets/sw.js \
                       assets/manifest.webmanifest; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "missing from APK: $entry"; exit 1; }
          done
          # Density folders come out of AGP with a -v4 qualifier.
          unzip -Z1 "$APK" | grep -qE '^res/mipmap-[a-z]+(-v[0-9]+)?/ic_launcher\.png$' \
            || { echo "missing from APK: a launcher icon"; exit 1; }
          echo "assets in APK: $(unzip -Z1 "$APK" | grep -c '^assets/')"
          echo "apk size: $(du -h "$APK" | cut -f1)"

      - name: Name the APK
        working-directory: football-manager/android
        run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/kalahari-manager.apk
          ls -la ../../out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalahari-manager-apk
          path: out/kalahari-manager.apk
          if-no-files-found: error

      # A release asset is a plain one-tap download on a phone, unlike the
      # zipped, sign-in-only run artifact above. The tag is rolling: the same
      # URL always points at the newest build.
      - name: Publish the APK as a release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/football-manager-mobile-game-gtn8do'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: kalahari-manager-latest
        run: |
          set -euo pipefail
          NOTES="Kalahari Manager — debug-signed build of football-manager/ at ${GITHUB_SHA::7}.

          Install on Android: download the APK, open it, and allow installs from your browser when asked.
          It needs no account and makes no network requests; your career is saved on the device."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/kalahari-manager.apk --clobber
            gh release edit "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" out/kalahari-manager.apk \
              --title "Kalahari Manager (latest build)" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes \(.url)"'
